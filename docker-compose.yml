services:
  postgresql:
    image: postgres:16
    container_name: banking-postgres
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: BankingDev2026!
    ports:
      - "5432:5432"
    volumes:
      - banking_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  banking_data:
