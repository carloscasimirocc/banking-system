spring.application.name=banking-system

# postgreSQl Database Configuration
# Endereço da base de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/banking_db
# credenciais de acesso (user: passw)
spring.datasource.username=banking_user
spring.datasource.password=BankingDev2026!

# JPA / Hibernate Configuration
# Para que o Hibernate actualize o esquema 
# da base de dados durante o Desenvolvimento [não em Produção]
spring.jpa.hibernate.ddl-auto=create
# Mostra ao terminal as instruções SQL executadas
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
